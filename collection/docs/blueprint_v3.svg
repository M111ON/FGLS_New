<svg xmlns="http://www.w3.org/2000/svg" viewBox="-220 -220 440 440" width="880" height="880">
  <defs>
    <style>
      .bg { fill: #0d0d0d; }
      .edge  { stroke: #ffb74d; stroke-width: 3; }
      .edge-g { stroke: #ffb74d; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .a36   { stroke: #e040fb; stroke-width: 2; }  /* 36° construction line */
      .a72   { stroke: #4fc3f7; stroke-width: 2; }  /* 72° pentagon */
      .a60   { stroke: #ff5252; stroke-width: 2; }  /* 60° hex */
      .pent  { fill: none; stroke: #4fc3f7; stroke-width: 1.5; }
      .pentC  { fill: none; stroke: #4fc3f7; stroke-width: 1; stroke-dasharray: 3 3; }
      .hex   { fill: none; stroke: #ff5252; stroke-width: 1.5; }
      .tri-h  { fill: rgba(255,82,82,0.06); stroke: #ff5252; stroke-width: 0.5; }
      .tri-p  { fill: rgba(68,130,255,0.06); stroke: #448aff; stroke-width: 0.5; }
      .tri-c  { fill: rgba(255,183,77,0.06); stroke: #ffb74d; stroke-width: 0.5; }
      .label  { fill: #555; font: 8px monospace; }
      .l-bl   { fill: #4fc3f7; font: 9px monospace; }
      .l-gr   { fill: #81c784; font: 9px monospace; }
      .l-or   { fill: #ffb74d; font: 10px monospace; font-weight: bold; }
      .l-pu   { fill: #e040fb; font: 9px monospace; }
      .l-re   { fill: #ff5252; font: 9px monospace; }
      .dot-o  { fill: #ffb74d; }
      .dot-a  { fill: #4fc3f7; }
      .dot-b  { fill: #81c784; }
      .dot-p  { fill: #e040fb; }
      .title  { fill: #eee; font: 13px sans-serif; }
    </style>
  </defs>

  <rect class="bg" x="-220" y="-220" width="440" height="440"/>

  <!-- ====== STEP 0: Reference origin (center) ====== -->
  <!-- Base edge: a0(0,-60) to b1(80,0) — manually adjusted for visual clarity -->

  <!-- ====== 1. BASE EDGE (the only primal geometry) ====== -->
  <line class="edge" x1="0" y1="-60" x2="80" y2="0"/>

  <!-- ====== 2. 36° FROM EDGE → FIND PENATONE CENTER ====== -->
  <!-- Shoot 36° from both ends of the base edge, intersection = center -->
  <!-- From a0(0,-60), rotate vector to b1(80,0) by +36° and -36° -->
  <!-- From b1(80,0), rotate vector to a0(0,-60) by +36° and -36° -->
  <!-- The intersection of the inward 36° lines gives the pentagon center -->
  <!-- Center ≈ (22, -30) in this approximate layout -->

  <!-- Actually let me recalculate properly with the geometry -->
  <!-- Base edge from a0 to b1, length ≈ sqrt(80²+60²)=100 -->
  <!-- Pentagon center = intersection of 36° lines from both ends -->
  <!-- A more accurate center is approximately (20,-28) -->

  <line class="a36" x1="0" y1="-60" x2="25" y2="-50"/>
  <line class="a36" x1="80" y1="0" x2="25" y2="-50"/>
  <circle class="dot-p" cx="20" cy="-28" r="4"/>
  <text class="l-pu" x="25" y="-30">C</text>

  <!-- 36° angle arcs from base edge -->
  <path class="a36" d="M 40,-32 A 8,8 0 0,0 46,-35" stroke-width="1"/>
  <text class="l-pu" x="35" y="-25">36°</text>
  <path class="a36" d="M 60,-18 A 8,8 0 0,0 66,-15" stroke-width="1"/>
  <text class="l-pu" x="55" y="-13">36°</text>

  <!-- ====== 3. LINES FROM CENTER TO a0 AND b1 ====== -->
  <line class="a72" x1="0" y1="-60" x2="20" y2="-28" stroke-dasharray="3 3"/>
  <line class="a72" x1="80" y1="0" x2="20" y2="-28" stroke-dasharray="3 3"/>

  <!-- ====== 4. 72° FROM center-a0 AND center-b1 → FULL PENTAGON ====== -->
  <!-- From center(a0) shoot 72° twice to get other pent vertices -->
  <!-- pent vertices at 72° increments around center -->
  <!-- C(20,-28), v0(0,-60), v1≈(45,-55), v2≈(40,-10), v3≈(0,0), v4≈(-5,-40) -->

  <polygon class="pentC" points="0,-60 70,-25 32,25 -28,15 -12,-45"/>

  <!-- 72° arcs from center lines -->
  <path class="a72" d="M 28,-40 A 10,10 0 0,0 35,-32" stroke-width="1"/>
  <text class="l-bl" x="32" y="-36">72°</text>

  <!-- ====== 5. 60° FROM EDGE → FULL HEXAGON ====== -->
  <!-- From base edge a0-b1, expand 60° outward to find hex vertices -->
  <!-- x0,x1 = a0,b1. x2 = rotate a0→b1 by +60° at a0. x3 = rotate a0→b1 by -60° at b1... -->
  <!-- Approximate hex vertices -->
  <polygon class="hex" points="0,-60 80,0 100,65 40,95 -30,70 -40,5"/>

  <!-- 60° arcs from both ends of base edge -->
  <path class="a60" d="M 50,8 A 10,10 0 0,1 42,0" stroke-width="1"/>
  <text class="l-re" x="50" y="-2">60°</text>

  <!-- ====== FULL PENTAGON (completed from 72°) ====== -->
  <polygon class="pent" points="0,-60 70,-25 32,25 -28,15 -12,-45"/>

  <!-- ====== CENTROID OF FIRST TRI (from base edge + center) ====== -->
  <!-- Triangle: a0(0,-60), C(20,-28), b1(80,0) → centroid ≈ (33,-29) -->
  <polygon class="tri-c" points="0,-60 20,-28 80,0"/>
  <circle class="dot-o" cx="33" cy="-29" r="2.5"/>
  <text class="l-or" x="36" y="-28">TC</text>
  <circle class="dot-b" cx="80" cy="0" r="3"/>
  <text class="l-gr" x="82" y="-2">T</text>

  <!-- ====== LABELS ====== -->
  <text class="l-or" x="35" y="-3" font-size="11">BASE</text>
  <text class="l-bl" x="2" y="-63">a0</text>
  <text class="l-gr" x="76" y="5">b1</text>

  <rect class="tri-c" x="-210" y="160" width="10" height="10"/>
  <text class="label" fill="#ffb74d" x="-195" y="169">tri centroid (center + base)</text>
  <rect class="tri-p" x="-210" y="175" width="10" height="10"/>
  <text class="label" fill="#448aff" x="-195" y="184">pent triangle (72°)</text>
  <rect class="tri-h" x="-210" y="190" width="10" height="10"/>
  <text class="label" fill="#ff5252" x="-195" y="199">hex triangle (60°)</text>
  <circle class="dot-p" cx="-205" cy="207" r="3"/>
  <text class="label" fill="#e040fb" x="-195" y="211">center (36° intersection)</text>

  <text class="title" x="-120" y="-195">Blueprint Construction</text>
  <text class="label" x="-120" y="-182">1 base edge → 36°→center → 72°→pentagon → 60°→hexagon</text>
</svg>
