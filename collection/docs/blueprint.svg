<svg xmlns="http://www.w3.org/2000/svg" viewBox="-200 -200 400 400" width="800" height="800">
  <defs>
    <style>
      .bg { fill: #0d0d0d; }
      .pentA { fill: none; stroke: #4fc3f7; stroke-width: 1.5; }
      .pentB { fill: none; stroke: #81c784; stroke-width: 1.5; }
      .edge  { stroke: #ffb74d; stroke-width: 2; stroke-dasharray: 4 3; }
      .angle60 { stroke: #ff5252; stroke-width: 1; }
      .angle54 { stroke: #448aff; stroke-width: 1; }
      .angle72 { stroke: #e040fb; stroke-width: 1; }
      .tri    { fill: rgba(255,183,77,0.08); stroke: #ffb74d; stroke-width: 0.5; }
      .pgram  { stroke: #ffd54f; stroke-width: 1; stroke-dasharray: 2 4; fill: none; }
      .label  { fill: #aaa; font: 10px monospace; }
      .title  { fill: #eee; font: 14px sans-serif; font-weight: bold; }
      .dot    { fill: #fff; }
      .dot-a  { fill: #4fc3f7; }
      .dot-b  { fill: #81c784; }
    </style>
  </defs>

  <rect class="bg" x="-200" y="-200" width="400" height="400"/>

  <!-- Pentagon A vertices: 72° intervals starting at 90° -->
  <!-- Pentagon B vertices: 72° intervals starting at 90°+36° -->
  <!-- radius = 80 -->
  <!-- Helper: a[i] = (r*cos(90°+i*72°), r*sin(90°+i*72°)) -->

  <!-- Generate pentagon A -->
  <polygon class="pentA" points="
    0,-80
    76.1,-24.7
    47.0,64.7
    -47.0,64.7
    -76.1,-24.7
  "/>

  <!-- Generate pentagon B (rotated 36°) -->
  <polygon class="pentB" points="
    47.0,-64.7
    80.9,9.8
    0.0,80.0
    -80.9,9.8
    -47.0,-64.7
  "/>

  <!-- Base edge: a[0] → b[1] -->
  <line class="edge" x1="0" y1="-80" x2="80.9" y2="9.8"/>

  <!-- Triangles between pentagons (one highlighted) -->
  <!-- Tri between a[0](0,-80), b[0](47,-64.7), b[1](80.9,9.8) -->
  <polygon class="tri" points="0,-80 47,-64.7 80.9,9.8"/>
  <polygon class="tri" points="0,-80 80.9,9.8 76.1,-24.7"/>

  <!-- ====== ANGLE ARCS ====== -->
  <!-- 60° at a[0] between a[-1] and b[1] -->
  <!-- a[-1] = a[4] = -47,-64.7, a[0] = 0,-80, b[1] = 80.9,9.8 -->
  <path class="angle60" d="M -14.6,-75.5 A 20,20 0 0,1 18.0,-70.5"/>
  <!-- 54° at b[1] between a[0] and b[2] -->
  <!-- b[2] = 0,80, b[1] = 80.9,9.8, a[0] = 0,-80 -->
  <path class="angle54" d="M 68.7,2.1 A 20,20 0 0,0 61.5,23.3"/>
  <!-- 72° at intersection point -->

  <!-- ====== PENTAGRAM (overlap of pentA diagonals) ====== -->
  <line class="pgram" x1="0" y1="-80" x2="47" y2="64.7"/>
  <line class="pgram" x1="76.1" y1="-24.7" x2="-47" y2="64.7"/>
  <line class="pgram" x1="47" y1="64.7" x2="-76.1" y2="-24.7"/>
  <line class="pgram" x1="-47" y1="64.7" x2="0" y2="-80"/>
  <line class="pgram" x1="-76.1" y1="-24.7" x2="76.1" y2="-24.7"/>

  <!-- ====== LABELS ====== -->
  <text class="label" x="5" y="-84">a[0]</text>
  <text class="label" x="84" y="5">b[1]</text>
  <text class="label" x="50" y="-67">b[0]</text>
  <text class="label" x="-55" y="-28">a[4]</text>
  <text class="label" x="78" y="-28">a[1]</text>
  <text class="label" x="50" y="68">a[2]</text>
  <text class="label" x="-52" y="68">a[3]</text>
  <text class="label" x="-84" y="13">b[4]</text>
  <text class="label" x="-50" y="-67">b[3]</text>
  <text class="label" x="3" y="84">b[2]</text>

  <!-- angle labels -->
  <text class="label" fill="#ff5252" x="-28" y="-72">60°</text>
  <text class="label" fill="#448aff" x="64" y="18">54°</text>
  <text class="label" fill="#e040fb" x="30" y="-42">72°</text>

  <!-- base edge label -->
  <text class="label" fill="#ffb74d" x="35" y="-40">BASE</text>

  <!-- ====== DOTS ====== -->
  <circle class="dot-a" cx="0" cy="-80" r="3"/>
  <circle class="dot-a" cx="76.1" cy="-24.7" r="3"/>
  <circle class="dot-a" cx="47" cy="64.7" r="3"/>
  <circle class="dot-a" cx="-47" cy="64.7" r="3"/>
  <circle class="dot-a" cx="-76.1" cy="-24.7" r="3"/>
  <circle class="dot-b" cx="47" cy="-64.7" r="3"/>
  <circle class="dot-b" cx="80.9" cy="9.8" r="3"/>
  <circle class="dot-b" cx="0" cy="80" r="3"/>
  <circle class="dot-b" cx="-80.9" cy="9.8" r="3"/>
  <circle class="dot-b" cx="-47" cy="-64.7" r="3"/>

  <!-- Title -->
  <text class="title" x="-90" y="-175">Blueprint: Base Edge + Angles</text>
  <text class="label" x="-150" y="180">orange = tri+tip zone | red=60° blue=54° purple=72°</text>
  <text class="label" x="-150" y="192">gold dash = φ pentagram (self-similar)</text>
</svg>
