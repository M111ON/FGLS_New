<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Chat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
       background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
#header { background: #16213e; padding: 12px 20px; display: flex; align-items: center; gap: 12px;
           border-bottom: 1px solid #0f3460; flex-shrink: 0; }
#header h1 { font-size: 16px; color: #e94560; }
#server-url { background: #1a1a2e; border: 1px solid #0f3460; color: #e0e0e0; padding: 4px 8px;
              border-radius: 4px; font-size: 13px; flex: 1; min-width: 200px; }
#connect-btn { background: #e94560; color: white; border: none; padding: 6px 16px; border-radius: 4px;
               cursor: pointer; font-size: 13px; }
#connect-btn:hover { background: #c73650; }
#status { font-size: 12px; color: #888; }
#status.online { color: #4ecca3; }
#chat { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; font-size: 14px; }
.user { align-self: flex-end; background: #e94560; color: white; border-bottom-right-radius: 4px; }
.assistant { align-self: flex-start; background: #16213e; color: #e0e0e0; border-bottom-left-radius: 4px; }
.msg pre { background: #0f3460; padding: 8px; border-radius: 4px; overflow-x: auto; margin-top: 6px; font-size: 13px; }
.thinking { align-self: flex-start; color: #888; font-style: italic; font-size: 13px; }
#input-area { display: flex; gap: 8px; padding: 12px 20px; background: #16213e; border-top: 1px solid #0f3460; }
#input { flex: 1; background: #1a1a2e; border: 1px solid #0f3460; color: #e0e0e0; padding: 10px 14px;
         border-radius: 8px; font-size: 14px; resize: none; outline: none; }
#input:focus { border-color: #e94560; }
#send-btn { background: #e94560; color: white; border: none; padding: 10px 20px; border-radius: 8px;
            cursor: pointer; font-size: 14px; }
#send-btn:hover { background: #c73650; }
#send-btn:disabled { background: #555; cursor: not-allowed; }
#model-select { background: #1a1a2e; border: 1px solid #0f3460; color: #e0e0e0; padding: 4px 8px;
                border-radius: 4px; font-size: 13px; }
</style>
</head>
<body>
<div id="header">
  <h1>LLM Chat</h1>
  <input id="server-url" value="http://192.168.1.176:8080" placeholder="Server URL">
  <select id="model-select"><option value="">(default model)</option></select>
  <button id="connect-btn">Connect</button>
  <span id="status">Offline</span>
</div>
<div id="chat"></div>
<div id="input-area">
  <textarea id="input" rows="1" placeholder="Type a message..." disabled></textarea>
  <button id="send-btn" disabled>Send</button>
</div>

<script>
let baseUrl = '';
let online = false;

document.getElementById('connect-btn').onclick = connect;
document.getElementById('server-url').onkeydown = e => { if (e.key === 'Enter') connect(); };

async function connect() {
  baseUrl = document.getElementById('server-url').value.trim().replace(/\/+$/, '');
  const status = document.getElementById('status');
  status.textContent = 'Connecting...';
  status.className = '';
  online = false;
  document.getElementById('input').disabled = true;
  document.getElementById('send-btn').disabled = true;

  try {
    const r = await fetch(baseUrl + '/v1/models', { signal: AbortSignal.timeout(3000) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    online = true;
    status.textContent = 'Online';
    status.className = 'online';
    document.getElementById('input').disabled = false;
    document.getElementById('send-btn').disabled = false;
    document.getElementById('input').focus();

    // Populate models
    const sel = document.getElementById('model-select');
    sel.innerHTML = '<option value="">(default model)</option>';
    if (data.data) {
      for (const m of data.data) {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = m.id;
        sel.appendChild(opt);
      }
    }
    addMsg('system', 'Connected to ' + baseUrl);
  } catch (e) {
    status.textContent = 'Error: ' + e.message;
    status.className = '';
    addMsg('system', 'Connection failed: ' + e.message);
  }
}

document.getElementById('send-btn').onclick = send;
document.getElementById('input').onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
};

async function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || !online) return;
  input.value = '';
  input.style.height = 'auto';

  addMsg('user', text);
  const thinkEl = addMsg('thinking', 'Thinking...');

  const model = document.getElementById('model-select').value || null;
  document.getElementById('send-btn').disabled = true;
  input.disabled = true;

  try {
    const body = { messages: [{ role: 'user', content: text }], stream: false };
    if (model) body.model = model;
    const r = await fetch(baseUrl + '/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const reply = data.choices?.[0]?.message?.content || '(no response)';
    thinkEl.remove();
    addMsg('assistant', reply);
  } catch (e) {
    thinkEl.remove();
    addMsg('system', 'Error: ' + e.message);
  } finally {
    document.getElementById('send-btn').disabled = false;
    input.disabled = false;
    input.focus();
  }
}

function addMsg(role, content) {
  const chat = document.getElementById('chat');
  const el = document.createElement('div');
  if (role === 'system') {
    el.className = 'thinking';
    el.textContent = '⏺ ' + content;
  } else if (role === 'thinking') {
    el.className = 'thinking';
    el.textContent = content;
  } else {
    el.className = 'msg ' + role;
    el.textContent = content;
  }
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

// Auto-resize textarea
document.getElementById('input').oninput = function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 150) + 'px';
};
</script>
</body>
</html>
