<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROSE — Project Source Explorer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:'Segoe UI','Courier New',monospace;padding:20px}
header{text-align:center;padding:16px 0 8px}
header h1{color:#58a6ff;font-size:22px}
header p{color:#8b949e;font-size:12px;margin-top:2px}
#topbar{display:flex;max-width:1100px;margin:10px auto;gap:10px;align-items:center}
#topbar input{flex:1;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:6px 12px;color:#c9d1d9;font-size:12px;outline:none}
#topbar input:focus{border-color:#58a6ff}
#topbar #count{color:#484f58;font-size:11px}
#topbar button{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:10px}
#topbar button:hover{background:#30363d}
#export-btn{background:#1f6feb;border:none;color:#fff;padding:4px 16px;border-radius:4px;cursor:pointer;font-size:11px}
#export-btn:hover{background:#388bfd}
.maze{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:1100px;margin:12px auto}
@media(max-width:900px){.maze{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.maze{grid-template-columns:1fr}}
.mcard{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;cursor:pointer;transition:all .1s;position:relative}
.mcard:hover{transform:translateY(-1px)}
.mcard .mtitle{font-size:13px;font-weight:bold;margin-bottom:2px}
.mcard .mrole{font-size:9px;color:#484f58;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:1px}
.mcard .msize{font-size:10px;color:#484f58;margin-bottom:4px}
.mcard .badge{position:absolute;top:8px;right:10px;font-size:10px;color:#484f58}
.mcard .doclink{position:absolute;top:8px;right:42px;font-size:10px;color:#8b949e;cursor:pointer;text-decoration:none;padding:1px 6px;border-radius:3px;background:#1c2128;display:none}
.mcard .doclink:hover{background:#30363d;color:#58a6ff}
.mcard .doclink.show{display:block}
.mfiles{display:none;margin-top:5px;border-top:1px solid #30363d;padding-top:5px}
.mfiles.show{display:block}
.mfile{padding:4px 8px;margin:2px 0;border-radius:4px;font-size:10px;cursor:pointer;background:#1c2128;display:flex;flex-direction:column;gap:2px;transition:all .1s}
.mfile:hover{background:#30363d}
.mfile .fname{color:#e6edf3;font-weight:bold}
.mfile .fpurpose{color:#8b949e;font-size:9px;line-height:1.4}
#src-area{display:none;max-width:1100px;margin:12px auto;background:#0d1117;border:1px solid #30363d;border-radius:8px;overflow:hidden}
#src-area.show{display:block}
#src-area .head{background:#161b22;padding:6px 14px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center}
#src-area .head .path{font-size:11px;color:#58a6ff}
#src-area .head .purpose{font-size:10px;color:#484f58;margin-left:10px}
#src-area .head button{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:2px 10px;border-radius:4px;cursor:pointer;font-size:10px}
#src-area pre{margin:0;padding:12px 14px;font-size:11px;line-height:1.5;overflow:auto;max-height:50vh;color:#e6edf3;tab-size:4}
#doc-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:100}
#doc-modal.show{display:flex;align-items:center;justify-content:center}
#doc-modal .box{background:#0d1117;border:1px solid #30363d;border-radius:8px;width:80%;max-width:800px;max-height:80vh;overflow:hidden;display:flex;flex-direction:column}
#doc-modal .head{background:#161b22;padding:10px 16px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center}
#doc-modal .head span{font-size:13px;color:#58a6ff}
#doc-modal .head button{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:2px 10px;border-radius:4px;cursor:pointer}
#doc-modal .body{padding:16px;overflow-y:auto;font-size:13px;line-height:1.7;color:#e6edf3}
#doc-modal .body h1{color:#58a6ff;font-size:18px;margin:0 0 8px}
#doc-modal .body h2{color:#79c0ff;font-size:15px;margin:16px 0 6px;border-bottom:1px solid #21262d;padding-bottom:4px}
#doc-modal .body h3{color:#8b949e;font-size:13px;margin:12px 0 4px}
#doc-modal .body code{background:#1c2128;padding:1px 5px;border-radius:3px;font-size:12px;color:#e6edf3}
#doc-modal .body pre{background:#1c2128;padding:10px 14px;border-radius:6px;overflow-x:auto;font-size:11px;margin:8px 0}
#doc-modal .body table{border-collapse:collapse;margin:8px 0;font-size:12px}
#doc-modal .body th{background:#161b22;color:#8b949e;padding:4px 10px;border:1px solid #30363d;text-align:left}
#doc-modal .body td{padding:4px 10px;border:1px solid #30363d}
#doc-modal .body strong{color:#e6edf3}
.footer{text-align:center;padding:16px;color:#484f58;font-size:10px}
</style>
</head>
<body>
<header>
  <h1>POGLS Toolchain</h1>
  <p>Project Source Explorer · <span id="total">0</span> files</p>
</header>
<div id="topbar">
  <input type="text" id="search" placeholder="Search files or purpose..." oninput="filterFiles()"/>
  <span id="count">0</span>
  <button id="export-btn" onclick="exportFiles()"> Export</button>
</div>
<div class="maze" id="maze"></div>
<div id="src-area"><div class="head"><span><span class="path" id="src-path"></span><span class="purpose" id="src-purpose"></span></span><button onclick="closeSrc()">x</button></div><iframe id="src-frame" style="width:100%;height:50vh;border:none;background:#0d1117;"></iframe></div>
<div class="footer">Ctrl+F search · Esc close source · doc button on each module</div>
<div id="doc-modal"><div class="box">
  <div class="head"><span id="doc-title">Documentation</span><button onclick="closeDoc()">x</button></div>
  <div class="body" id="doc-body"></div>
</div></div>
<script>var PROSE_JSON ={
 "project": "POGLS Toolchain",
 "version": "1.0",
 "root": "runner",
 "modules": [
  {"name":"core","label":"pogls_core","role":"Foundation Layer","desc":"Platform abstraction, compression API, 144 address space, v2 metadata format","tests":38,"doc":"pogls-core","files":[
   {"path":"pogls_core/pogls_platform.h","purpose":"Platform: VirtualAlloc/mmap, 64-bit file I/O, xorshift32 PRNG"},
   {"path":"pogls_core/pogls_platform.c","purpose":"Platform impl: Win32/POSIX branches"},
   {"path":"pogls_core/pogls_compress.h","purpose":"Compression API: ZSTD + RAW fallback"},
   {"path":"pogls_core/pogls_compress.c","purpose":"Compression impl: guarded by POGLS_USE_ZSTD"},
   {"path":"pogls_core/pogls_addr.h","purpose":"144 address space: tier0-3, FNV-1a hash, capo rotation"},
   {"path":"pogls_core/pogls_addr.c","purpose":"Address space impl: macro micro decompose"},
   {"path":"pogls_core/pogls_meta.h","purpose":"POGLS v2 format: header tensor meta model meta"},
   {"path":"pogls_core/pogls_meta.c","purpose":"Format read/write: binary search by addr or name"},
   {"path":"pogls_core/pogls_core.h","purpose":"Umbrella include: single include for all sub-headers"},
   {"path":"pogls_core/pogls_store.h","purpose":"Store contract: put/get/foreach lifecycle"}]},
  {"name":"gguf","label":"pogls_gguf","role":"GGUF Reader Layer","desc":"Standalone GGUF file parser no llama.cpp dep","tests":9,"doc":"pogls-gguf","files":[
   {"path":"pogls_gguf/pogls_gguf.h","purpose":"Public API: reader index structs open read close"},
   {"path":"pogls_gguf/pogls_gguf.c","purpose":"Full GGUF parser: 31-type table KV skip tensor index"}]},
  {"name":"geo","label":"pogls_geo","role":"Geometric Addressing Layer","desc":"Y-triangle coordinate system: 144 face jump triplet","tests":18,"doc":"pogls-geo","files":[
   {"path":"pogls_geo/pogls_geo.h","purpose":"Geo API: decompose compose jump name hash triplet"},
   {"path":"pogls_geo/pogls_geo.c","purpose":"Geo impl: FNV-1a hash 12-face pentagon triplet table"}]},
  {"name":"dram","label":"pogls_dram","role":"Memory Store Layer","desc":"Flat-arena DRamTile: put/get by addr or name","tests":8,"doc":"pogls-dram","files":[
   {"path":"pogls_dram/pogls_dram.h","purpose":"DRamTile API: open close put get name free save"},
   {"path":"pogls_dram/pogls_dram.c","purpose":"DRamTile impl: flat arena KV flag bit 31 masking"}]},
  {"name":"bermuda","label":"pogls_bermuda","role":"Routing + Compression Layer","desc":"Stride-37 router Diamond Shell 3D RLE shadow","tests":159,"doc":"pogls-bermuda","files":[
   {"path":"pogls_bermuda/pogls_bermuda.h","purpose":"Bermuda API: route face scores diamond RLE shadow"},
   {"path":"pogls_bermuda/pogls_bermuda.c","purpose":"Bermuda impl: Stride-37 Diamond Shell RLE ring buffer"}]},
  {"name":"kv","label":"pogls_kv","role":"KV Cache Layer","desc":"Adaptive KV remap: ENTROPY GEO REBUILD 3-lane rail","tests":9,"doc":"pogls-kv","files":[
   {"path":"pogls_kv/pogls_kv.h","purpose":"KV API: skeleton classify encode decode rail"},
   {"path":"pogls_kv/pogls_kv.c","purpose":"KV impl: RLE GEO range delta 3-lane rail scanner"}]},
  {"name":"geopixel","label":"pogls_geopixel","role":"Pixel Compression Layer","desc":"64B block codec: FLAT SMOOTH GRADIENT EDGE Hilbert","tests":39,"doc":"pogls-geopixel","files":[
   {"path":"pogls_geopixel/pogls_geopixel.h","purpose":"Geopixel API: encode decode block tensor Hilbert session"},
   {"path":"pogls_geopixel/pogls_geopixel.c","purpose":"Geopixel impl: classify variance Hilbert 2D session feed"}]},
  {"name":"tools","label":"pogls_tools","role":"CLI Tools","desc":"14 command-line utilities for build inspect test debug","tests":0,"doc":"pogls-tools","files":[
   {"path":"pogls_tools/pogls_compress.c","purpose":"CLI compress tensor data"},
   {"path":"pogls_tools/pogls_decompress.c","purpose":"CLI decompress tensor data"},
   {"path":"pogls_tools/pogls_inspect.c","purpose":"CLI inspect .pogls"},
   {"path":"pogls_tools/pogls_roundtrip.c","purpose":"CLI roundtrip verify"},
   {"path":"pogls_tools/pogls_build.c","purpose":"CLI build .pogls from GGUF"},
   {"path":"pogls_tools/pogls_cat.c","purpose":"CLI concatenate .pogls"},
   {"path":"pogls_tools/pogls_diff.c","purpose":"CLI diff .pogls"},
   {"path":"pogls_tools/pogls_verify.c","purpose":"CLI verify .pogls"},
   {"path":"pogls_tools/pogls_test.c","purpose":"CLI test runner"},
   {"path":"pogls_tools/addr_resolve.c","purpose":"CLI name to address"},
   {"path":"pogls_tools/gguf_dump.c","purpose":"CLI dump GGUF"},
   {"path":"pogls_tools/dramtile_dump.c","purpose":"CLI dump DRamTile"},
   {"path":"pogls_tools/dramtile_bench.c","purpose":"CLI bench DRamTile"},
   {"path":"pogls_tools/kv_delta_bench.c","purpose":"CLI bench KV delta"}]}
 ]
}
</script>
<script>
let PROSE = PROSE_JSON;
const SRC_CACHE = {};
let openFiles = null;

document.getElementById('total').textContent = (()=>{
  let n=0;PROSE.modules.forEach(m=>n+=(m.files||[]).length);return n;
})();

const MOD_COLORS = {
  'core':'#58a6ff','gguf':'#3fb950','geo':'#d29922',
  'dram':'#f0883e','bermuda':'#bc8cff','kv':'#79c0ff',
  'geopixel':'#ff7b72','tools':'#8b949e'
};

function render(){
  document.getElementById('maze').innerHTML = '';
  PROSE.modules.forEach(m => {
    const files = m.files || [];
    const card = document.createElement('div');
    card.className = 'mcard';
    card.style.borderColor = MOD_COLORS[m.name]||'#30363d';
    card.innerHTML = `<span class="badge">${m.tests||'—'}</span>
      <a class="doclink${m.doc?' show':''}" onclick="event.stopPropagation();openDoc('${m.name}')"> doc</a>
      <div class="mrole">${m.role||''}</div>
      <div class="mtitle" style="color:${MOD_COLORS[m.name]||'#c9d1d9'}">${m.label||m.name}</div>
      <div class="msize">${files.length} files · ${m.desc||''}</div>
      <div class="mfiles" id="mf_${m.name}"></div>`;
    const fdiv = card.querySelector('.mfiles');
    files.forEach(f => {
      const el = document.createElement('div');
      el.className = 'mfile';
      el.dataset.path = f.path;
      el.dataset.purpose = f.purpose;
      el.innerHTML = `<span class="fname">${f.path.split('/').pop()}</span>
        <span class="fpurpose">${f.purpose}</span>`;
      el.title = f.purpose;
      el.onclick = (e)=>{e.stopPropagation();showSrc(m.name,f);};
      fdiv.appendChild(el);
    });
    card.onclick = ()=>{
      openFiles = openFiles === m.name ? null : m.name;
      document.querySelectorAll('.mfiles.show').forEach(el=>el.classList.remove('show'));
      if(openFiles) document.getElementById('mf_'+openFiles).classList.add('show');
    };
    document.getElementById('maze').appendChild(card);
  });
  document.getElementById('count').textContent = (()=>{let n=0;PROSE.modules.forEach(m=>n+=(m.files||[]).length);return n;})();
}

function filterFiles(){
  const q = document.querySelector('#search').value.toLowerCase();
  let vis = 0;
  document.querySelectorAll('.mcard').forEach(c=>{
    let show = false;
    c.querySelectorAll('.mfile').forEach(f=>{
      const match = !q || f.dataset.path.toLowerCase().includes(q) || f.dataset.purpose.toLowerCase().includes(q);
      f.style.display = match ? 'flex' : 'none';
      if(match) show = true;
    });
    c.style.display = show ? 'block' : 'none';
    if(show) vis++;
  });
  const total = (()=>{let n=0;PROSE.modules.forEach(m=>n+=(m.files||[]).length);return n;})();
  document.getElementById('count').textContent = vis+'/'+total;
}

function showSrc(mod, file){
  const area = document.getElementById('src-area');
  document.getElementById('src-path').textContent = 'runner/'+file.path;
  document.getElementById('src-purpose').textContent = file.purpose;
  const ifr = document.getElementById('src-frame');
  ifr.src = '../runner/'+file.path;
  area.classList.add('show');
}
function closeSrc(){document.getElementById('src-area').classList.remove('show')}

let DOC_CACHE = {};
function openDoc(modName){
  const mod = PROSE.modules.find(m=>m.name===modName);
  if(!mod) return;
  const modal = document.getElementById('doc-modal');
  const body = document.getElementById('doc-body');
  document.getElementById('doc-title').textContent = mod.label+' — '+mod.role;
  modal.classList.add('show');
  // Show inline data immediately
  let h = '<h1>'+mod.label+'</h1><p><em>'+mod.role+'</em></p>';
  h += '<p>'+mod.desc+'</p>';
  if(mod.design_note) h += '<h2>Design Note</h2><p>'+mod.design_note+'</p>';
  h += '<h2>Files</h2><ul>';
  (mod.files||[]).forEach(f=>h += '<li><code>'+f.path.split('/').pop()+'</code> — '+f.purpose+'</li>');
  h += '</ul>';
  body.innerHTML = h;
  // Try to load .md for richer view
  if(mod.doc && !DOC_CACHE[mod.doc]){
    fetch('../docs/'+mod.doc+'.md').then(r=>{if(!r.ok)throw Error();return r.text()}).then(md=>{
      DOC_CACHE[mod.doc] = renderMD(md);
      if(modal.classList.contains('show')) body.innerHTML = DOC_CACHE[mod.doc];
    }).catch(()=>{/*inline view is sufficient*/});
  } else if(mod.doc && DOC_CACHE[mod.doc] && modal.classList.contains('show')){
    body.innerHTML = DOC_CACHE[mod.doc];
  }
}
function renderMD(md){
  let h = '';
  md.split('\n').forEach(line=>{
    if(line.startsWith('# ')) h += '<h1>'+line.slice(2)+'</h1>';
    else if(line.startsWith('## ')) h += '<h2>'+line.slice(3)+'</h2>';
    else if(line.startsWith('### ')) h += '<h3>'+line.slice(4)+'</h3>';
    else if(line.startsWith('- ')) h += '<p>\u2022 '+line.slice(2)+'</p>';
    else if(line.startsWith('| ')){}
    else if(line.trim()==='') h += '<br>';
    else h += '<p>'+line.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')+'</p>';
  });
  return h;
}
function closeDoc(){document.getElementById('doc-modal').classList.remove('show')}

async function exportFiles(){
  const q = document.querySelector('#search').value.toLowerCase();
  const all = [];
  PROSE.modules.forEach(m=>(m.files||[]).forEach(f=>{
    const path = 'runner/'+f.path;
    if(!q || path.toLowerCase().includes(q) || f.purpose.toLowerCase().includes(q)) all.push({path,purpose:f.purpose});
  }));
  if(all.length===0) return;
  // PowerShell script (Windows)
  let ps = '# PROSE export — '+all.length+' files\n';
  ps += '$DEST = "prose-export"\n';
  ps += 'if(!(Test-Path $DEST)) { New-Item -ItemType Directory -Path $DEST | Out-Null }\n\n';
  all.forEach(f=>{
    const dir = f.path.substring(0, f.path.lastIndexOf('/'));
    ps += 'if(!(Test-Path "$DEST/'+dir+'")) { New-Item -ItemType Directory -Path "$DEST/'+dir+'" | Out-Null }\n';
    ps += 'Copy-Item "'+f.path+'" "$DEST/'+f.path+'"\n';
  });
  ps += '\nWrite-Host "Exported '+all.length+' files to $DEST/"';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ps],{type:'text/plain'}));
  a.download = 'prose-export.ps1'; a.click();
  // manifest
  const a2 = document.createElement('a');
  a2.href = URL.createObjectURL(new Blob([all.map(f=>f.path).join('\n')],{type:'text/plain'}));
  a2.download = 'prose-manifest.txt'; a2.click();
  URL.revokeObjectURL(a.href); URL.revokeObjectURL(a2.href);
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeSrc();closeDoc()}
  if(e.ctrlKey&&e.key==='f'){e.preventDefault();document.getElementById('search').focus()}
});

render();
</script>
</body>
</html>
