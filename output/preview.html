<!DOCTYPE html>
<html>
<head>
    <title>Wallet Vector Preview</title>
    <style>
        body { background: #1a1a2e; color: #e0e0e0; font-family: monospace; padding: 20px; }
        h1 { color: #e94560; }
        .grid { display: flex; gap: 20px; flex-wrap: wrap; }
        .card { background: #0a0a1a; border: 1px solid #0f3460; padding: 10px; }
        img { max-width: 100%; }
    </style>
</head>
<body>
    <h1>Wallet Vector Preview</h1>
    <div class="grid">
        <div class="card">
            <h3>Single Card (addr=20736)</h3>
            <img src="wallet_vector.svg" alt="Wallet Vector">
        </div>
        <div class="card">
            <h3>Grid (6 cards)</h3>
            <img src="wallet_grid.svg" alt="Wallet Grid">
        </div>
    </div>
</body>
</html>
